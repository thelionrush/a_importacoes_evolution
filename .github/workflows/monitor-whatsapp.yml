name: Monitor WhatsApp

# REFORÇO (não é o agendador principal). O agendador principal é o pg_cron do Supabase (job 'evolution-health-5min', a cada 5 min,
# relógio confiável). Este workflow chama a mesma rota do sistema, mas o GitHub executa agendamentos de forma irregular
# (observado: ~9 execuções em 46 h, com lacunas de 4–7 h) — por isso NÃO serve sozinho. Se a rota falhar (ex.: o e-mail não saiu),
# este job fica vermelho e o GitHub avisa o dono do repositório por e-mail (canal independente do Resend).
# O GitHub desliga agendamentos de repositório público após 60 dias sem push; sem problema: o pg_cron continua.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: monitor-whatsapp
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar conexão do WhatsApp
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          code=$(curl -sS -o body.json -w "%{http_code}" --max-time 90 --retry 2 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" "$HEALTH_URL")
          echo "HTTP $code"
          cat body.json; echo
          [ "$code" = "200" ]
